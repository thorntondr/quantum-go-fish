<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Go Fish</title>
  <link rel="stylesheet" href="./shared.css">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="dee642cd-d758-433d-ba6c-3c3fcbb40f54"></script>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>Quantum Go Fish</h1>
      <p class="muted">Single-device playtest mode</p>
      <p id="status" class="muted"></p>
      <p id="turnActionNotice" class="callout callout--action" hidden></p>
      <p id="pendingAskNotice" class="callout" hidden></p>
      <p id="error" class="err"></p>
      <div class="controls-row" style="margin-top: 8px;">
        <button id="infoBtn" class="alt">How to Play</button>
        <a id="modeSwitchLink" href="./multi_device_beta.html" class="button-link">Multi-Device (Beta)</a>
      </div>
      <div id="activeGameActions" class="controls-row" style="margin-top: 8px;" hidden>
        <button id="playAgainBtn" class="primary">Play Again</button>
        <button id="startOverBtn">Start Over</button>
      </div>
    </section>

    <section id="rosterPanel" class="panel">
      <h2>Roster</h2>
      <label>
        Players (comma or newline separated)
        <textarea id="rosterInput">Alice, Bob, Cara</textarea>
      </label>
      <h3 style="margin-top: 16px;">Optional Rules</h3>
      <label class="checkbox-row" style="margin-top: 10px;">
        <input id="maxThreeToggle" type="checkbox">
          <span>Per-suit cap of 3: each player starts with at most 3 possible cards in any suit</span>
      </label>
      <label class="checkbox-row" style="margin-top: 10px;">
        <input id="allOrNothingToggle" type="checkbox">
          <span>All or nothing: a Yes answer must state and transfer the exact number of cards</span>
      </label>
      <label class="checkbox-row" style="margin-top: 10px;">
        <input id="drawPileToggle" type="checkbox">
          <span>Draw pile: add an extra suit and a four-card pile to draw from after a No answer</span>
      </label>
      <div class="controls-row" style="margin-top: 10px;">
        <button id="startBtn" class="primary">Start Game</button>
      </div>
    </section>

    <section id="movesPanel" class="panel" hidden>
      <h2>Moves</h2>
      <div class="controls-row">
        <label>
          Ask target
          <select id="askTarget"></select>
        </label>
        <label>
          Suit
          <select id="askSuit"></select>
        </label>
        <button id="askBtn" class="primary">Ask</button>
        <label id="yesCountWrap" hidden>
          Count
          <select id="yesCount"></select>
        </label>
        <button id="yesBtn">Answer Yes</button>
        <button id="noBtn">Answer No</button>
      </div>
    </section>

    <section id="gameStatePanel" class="panel" hidden>
      <h2>Game State</h2>
      <div id="state"></div>
    </section>
  </div>

  <div id="suitOverlay" class="overlay">
    <div class="overlay-panel">
      <h3>Customize Suit</h3>
      <p id="suitOverlayLabel" class="muted"></p>
      <label>
        Name
        <input id="suitNameInput" type="text" placeholder="e.g., Fish">
      </label>
      <label>
        Symbol
        <input id="suitSymbolInput" type="text" placeholder="e.g., 🐟">
      </label>
      <div id="emojiSuggestions" class="emoji-suggestions"></div>
      <label>
        Card Color
        <input id="suitColorInput" type="color" value="#d6d9de">
      </label>
      <div class="overlay-actions">
        <button id="suitSaveBtn" class="primary">Save</button>
        <button id="suitCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <div id="infoOverlay" class="overlay" hidden>
    <div class="overlay-panel overlay-panel--wide">
      <h3>How to Play</h3>
      <div id="infoContent" class="instructions-copy"></div>
      <div class="overlay-actions">
        <button id="infoCloseBtn" class="primary">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./assets/web/singleDevice.js"></script>
</body>
</html>
