<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Go Fish (Single Device)</title>
  <style>
    :root {
      --bg: #eef3f0;
      --card: #ffffff;
      --ink: #10251e;
      --muted: #476258;
      --accent: #1d7a5a;
      --accent-2: #145c44;
      --danger: #a11a1a;
      --border: #c6d6cd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #dff0e6 0%, rgba(223, 240, 230, 0) 40%),
        radial-gradient(circle at 88% 12%, #deebff 0%, rgba(222, 235, 255, 0) 38%),
        linear-gradient(130deg, #f5fbf7 0%, #e9f0f7 55%, #edf3ee 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(12, 32, 24, 0.08);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    p {
      margin: 6px 0;
    }

    .muted {
      color: var(--muted);
    }

    .err {
      color: var(--danger);
      min-height: 1.1rem;
      margin: 4px 0;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
      color: var(--muted);
      min-width: 140px;
    }

    input, select, button, textarea {
      border: 1px solid #b8cabf;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      width: 100%;
      min-height: 84px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.85rem;
      resize: vertical;
    }

    button {
      cursor: pointer;
      background: #f5faf7;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.alt {
      border-color: var(--accent-2);
      background: var(--accent-2);
      color: #fff;
    }

    button:disabled, select:disabled, input:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hand-board {
      display: grid;
      gap: 18px;
    }

    .hands-other {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      justify-content: center;
    }

    .hands-self {
      display: flex;
      justify-content: center;
    }

    .hand {
      --card-width: 170px;
      --card-height: calc(var(--card-width) * 14 / 9);
      --spine-width: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hand--self {
      --card-width: 230px;
      --spine-width: 34px;
      padding: 10px 16px 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #d8e2dc;
      box-shadow: 0 12px 24px rgba(15, 46, 33, 0.1);
    }

    .hand--highlight {
      padding: 10px 16px 18px;
      border-radius: 16px;
      background: rgba(214, 243, 228, 0.75);
      border: 2px solid #1b7a4a;
      box-shadow: 0 16px 26px rgba(27, 122, 74, 0.22);
      transform: translateY(-4px);
    }

    .hand--highlight .hand-label {
      color: #0f4f32;
    }

    .hand-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #2a4b3f;
    }

    .card-stack {
      position: relative;
      height: var(--card-height);
      min-width: calc(var(--card-width) + (var(--stack-count, 1) - 1) * var(--stack-offset, 26px));
    }

    .card-slot {
      position: absolute;
      top: 0;
    }

    .card {
      height: var(--card-height);
      border-radius: 14px;
      border: 1px solid #b7c6be;
      background: #fff;
      box-shadow: 0 10px 20px rgba(16, 32, 26, 0.12);
      overflow: hidden;
      display: flex;
    }

    .card--front,
    .card--back {
      width: var(--card-width);
    }

    .card-bands {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .card-band {
      flex: 1;
      position: relative;
      background: var(--band-color);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(16, 32, 26, 0.12);
    }

    .card-band:last-child {
      border-bottom: none;
    }

    .card--blank {
      border-style: dashed;
      border-color: #b7c6be;
    }

    .card-band--blank {
      background: #d6d9de;
    }

    .band-corner {
      position: absolute;
      font-size: 0.85rem;
      color: #26332e;
      opacity: 0.9;
    }

    .band-corner--tl {
      top: 6px;
      left: 8px;
    }

    .band-corner--br {
      bottom: 6px;
      right: 8px;
      transform: rotate(180deg);
    }

    .band-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .band-symbol {
      font-size: 1.6rem;
      line-height: 1;
      color: #1a2a24;
    }

    .band-name {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #23312c;
    }

    .debug-table {
      margin-top: 18px;
      overflow-x: auto;
      border-top: 1px dashed rgba(26, 50, 40, 0.2);
      padding-top: 12px;
    }

    .debug-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #ffffff;
    }

    .debug-table th,
    .debug-table td {
      border: 1px solid #c6d6cd;
      padding: 6px 8px;
      text-align: center;
    }

    .debug-table th {
      background: #f3f7f5;
      font-weight: 600;
    }

    .debug-table .impossible {
      color: #a11a1a;
      font-weight: 700;
    }

    .debug-table .ghost {
      color: #7a8b84;
    }

    .debug-table .guaranteed {
      color: #1d7a5a;
      font-weight: 700;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 30, 24, 0.45);
      padding: 16px;
      z-index: 50;
    }

    .overlay.active {
      display: flex;
    }

    .overlay-panel {
      width: min(420px, 92vw);
      background: #ffffff;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #cfd9d3;
      box-shadow: 0 18px 36px rgba(10, 20, 16, 0.2);
      display: grid;
      gap: 12px;
    }

    .overlay-panel h3 {
      margin: 0;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .emoji-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
    }

    .emoji-suggestion {
      border: 1px solid #c6d6cd;
      background: #f5faf7;
      padding: 4px 6px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    .emoji-suggestion:hover {
      background: #e6f2ec;
    }

    @media (max-width: 960px) {
      .hand {
        --card-width: 150px;
      }
      .hand--self {
        --card-width: 190px;
      }
      .card-stack {
        min-width: calc(var(--card-width) + (var(--stack-count, 1) - 1) * var(--stack-offset, 26px));
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <h1>Quantum Go Fish (Single Device)</h1>
      <p id="status" class="muted"></p>
      <p id="error" class="err"></p>
    </section>

    <section class="panel">
      <h2>Roster</h2>
      <label>
        Players (comma or newline separated)
        <textarea id="rosterInput">Alice, Bob, Cara</textarea>
      </label>
      <div class="controls-row" style="margin-top: 10px;">
        <button id="startBtn" class="primary">Start Game</button>
      </div>
    </section>

    <section class="panel">
      <h2>Game State</h2>
      <div id="state"></div>
    </section>

    <section class="panel">
      <h2>Moves</h2>
      <div class="controls-row">
        <label>
          Ask target
          <select id="askTarget"></select>
        </label>
        <label>
          Suit
          <select id="askSuit"></select>
        </label>
        <button id="askBtn" class="primary">Ask</button>
        <button id="yesBtn">Answer Yes</button>
        <button id="noBtn">Answer No</button>
      </div>
    </section>
  </div>

  <div id="suitOverlay" class="overlay">
    <div class="overlay-panel">
      <h3>Customize Suit</h3>
      <p id="suitOverlayLabel" class="muted"></p>
      <label>
        Name
        <input id="suitNameInput" type="text" placeholder="e.g., Moons">
      </label>
      <label>
        Symbol (emoji)
        <input id="suitSymbolInput" type="text" placeholder="e.g., 🌙">
      </label>
      <div id="emojiSuggestions" class="emoji-suggestions"></div>
      <label>
        Color
        <input id="suitColorInput" type="color" value="#d6d9de">
      </label>
      <div class="overlay-actions">
        <button id="suitSaveBtn" class="primary">Save</button>
        <button id="suitCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="../dist/src/web/singleDevice.js"></script>
</body>
</html>
